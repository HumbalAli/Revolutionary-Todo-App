# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.6 and the pytz library.
# If not specified, the default timezone is UTC.
# timezone = UTC

# max length of characters to apply to the
# "slug" field
# max_length = 40

# version_num - version number for the new revision
# include_symbol - the name of the database symbolic name
# include_name - the name of the database name
# include_schemas - include_schemas flag
# version_path_separator - URI compatible path separator (may be set to '\' on Windows)
# version_locations - list of version file locations to include in path
# version_path_separator = os

# The individual version_locations entries can optionally specify a "symbolic name"
# for themselves. Individual version locations are separated by the colon (":")
# character. The symbolic name is separated from the version location by the "="
# character. Example:
# version_locations = %(here)s/bar:myname=%(here)s/otherpath

# set to 'true' to search and use the version_locations for the script location
# use_version_locations = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S