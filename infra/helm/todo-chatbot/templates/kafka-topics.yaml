{{- if .Values.kafka.enabled }}
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .Values.kafka.topics.taskEvents }}
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka-cluster
    {{- include "todo-chatbot.labels" . | nindent 4 }}
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .Values.kafka.topics.reminders }}
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka-cluster
    {{- include "todo-chatbot.labels" . | nindent 4 }}
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "86400000"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .Values.kafka.topics.taskUpdates }}
  namespace: kafka
  labels:
    strimzi.io/cluster: todo-kafka-cluster
    {{- include "todo-chatbot.labels" . | nindent 4 }}
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "86400000"
    cleanup.policy: delete
{{- end }}
