apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-config
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  BACKEND_SERVICE_URL: "http://{{ include "todo-chatbot.fullname" . }}-backend:{{ .Values.backend.service.port | toString }}"
  NEXT_PUBLIC_API_URL: {{ .Values.config.nextPublicApiUrl | quote }}
  FRONTEND_PORT: {{ .Values.frontend.service.port | quote }}
  DATABASE_URL: {{ .Values.database.url | quote }}