# Default values for todo-chatbot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

backend:
  replicaCount: 2
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest

  service:
    type: ClusterIP
    port: 8000

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

frontend:
  replicaCount: 1
  imagePullSecrets: []
  podSecurityContext: {}
  securityContext: {}
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest

  service:
    type: NodePort
    port: 3000

  ingress:
    enabled: true
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: localhost
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

# Configuration for the database connection
database:
  url: "postgresql://user:password@postgres:5432/todo_db"

# Configuration for the OpenAI API
openai:
  apiKey: ""

# Additional configuration
config:
  backendServiceUrl: "http://{{ include \"todo-chatbot.fullname\" . }}-backend:{{ .Values.backend.service.port }}"
  nextPublicApiUrl: "http://localhost:8000" # Default for local dev, can be overridden

# Phase V: Kafka Configuration
kafka:
  enabled: true
  brokers: "todo-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  authType: "none"
  consumerGroup: "todo-app-backend"
  topics:
    taskEvents: "task-events"
    reminders: "reminders"
    taskUpdates: "task-updates"
  # For Redpanda Cloud (override in cloud values files)
  # brokers: "your-redpanda-cluster.redpanda.com:9092"
  # authType: "password"
  # sasl:
  #   username: ""
  #   password: ""

# Phase V: Dapr Configuration
dapr:
  enabled: true
  appId: "todo-backend"
  appPort: 8000
  appProtocol: "http"
  logLevel: "info"
  sidecar:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  components:
    pubsub:
      name: "kafka-pubsub"
      type: "pubsub.kafka"
    statestore:
      name: "statestore"
      type: "state.postgresql"
    bindings:
      cron:
        name: "reminder-cron"
        schedule: "*/1 * * * *"

# Phase V: Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Phase V: Migration Job
migration:
  enabled: true
  image:
    repository: todo-backend
    tag: latest
  command: ["alembic", "upgrade", "head"]